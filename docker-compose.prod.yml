services:
  web:
    build: .
    restart: unless-stopped
    env_file:
      - .env.production
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - staticfiles:/app/staticfiles

  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: elearning
      POSTGRES_USER: elearning
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U elearning -d elearning"]
      interval: 10s
      timeout: 5s
      retries: 5

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - staticfiles:/srv/staticfiles:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web

  # Nightly local Postgres dumps to a Docker volume with 14-day retention.
  # Before production use, pick an off-host destination and add one copy line
  # after pg_dump, e.g. `rclone copy "$$target" "$${BACKUP_REMOTE}"`, using a
  # backup image that includes the chosen CLI and mounted credentials.
  backups:
    image: postgres:16
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_RETENTION_DAYS: "14"
    volumes:
      - postgres_backups:/var/backups/db
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        mkdir -p /var/backups/db
        while :; do
          stamp="$$(date -u +%Y%m%dT%H%M%SZ)"
          target="/var/backups/db/elearning-$$stamp.sql.gz"
          echo "[backup] dumping to $$target"
          pg_dump -h db -U elearning -d elearning | gzip > "$$target"
          find /var/backups/db -name 'elearning-*.sql.gz' -type f -mtime +$${BACKUP_RETENTION_DAYS} -delete
          sleep 86400
        done

volumes:
  postgres_data:
  postgres_backups:
  staticfiles:
  caddy_data:
  caddy_config:
