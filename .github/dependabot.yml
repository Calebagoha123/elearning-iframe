version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      django:
        patterns:
          - "Django"
          - "psycopg*"
      tooling:
        patterns:
          - "*"
        exclude-patterns:
          - "Django"
          - "psycopg*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "monthly"
