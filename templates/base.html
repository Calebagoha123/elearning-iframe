{% load static %}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Course activity{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="{% static 'css/app.css' %}">
  </head>
  <body>
    <main class="shell">
      {% if messages %}
        <div class="messages" aria-live="polite" data-flash-messages>
          {% for message in messages %}
            <p class="message message-{{ message.tags }}">{{ message }}</p>
          {% endfor %}
        </div>
      {% endif %}
      {% block content %}{% endblock %}
    </main>
    <script>
      (() => {
        const container = document.querySelector("[data-flash-messages]");
        if (!container) return;
        const dismissable = container.querySelectorAll(".message:not(.message-error)");
        if (!dismissable.length) return;
        window.setTimeout(() => {
          dismissable.forEach(node => node.classList.add("is-dismissing"));
          window.setTimeout(() => {
            dismissable.forEach(node => node.remove());
            if (!container.querySelector(".message")) container.remove();
          }, 450);
        }, 5000);
      })();
    </script>
  </body>
</html>
